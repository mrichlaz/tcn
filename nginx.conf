# WebP content negotiation.
# Browsers that advertise WebP in Accept get the .webp twin of a JPEG/PNG;
# everyone else falls back to the original file. `Vary: Accept` keeps shared
# caches from serving a WebP body to a client that cannot decode it.
# This file is included inside the http{} block, so a top-level map is valid.
map $http_accept $webp_suffix {
    default "";
    "~*webp" ".webp";
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # --- Compression (smaller transfer, faster LCP) ---
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml
        font/woff2;

    # --- Security & SEO headers ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # --- Images: negotiate WebP, then long-lived immutable cache ---
    # add_header is not inherited once a location declares its own, so the
    # security headers are repeated here.
    location ~* ^(.+)\.(?:jpe?g|png)$ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Vary "Accept" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $1$webp_suffix $uri =404;
    }

    # --- Other hashed/static assets: long-lived immutable cache ---
    location ~* \.(?:css|js|mjs|webp|avif|gif|svg|ico|woff2?)$ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # --- SEO / AI discovery files: short cache so edits propagate quickly ---
    location = /sitemap.xml {
        types { }
        default_type application/xml;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    location ~* ^/(robots\.txt|llms\.txt)$ {
        types { }
        default_type text/plain;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    # --- HTML: always revalidate so content and SEO edits go live immediately ---
    location ~* \.html$ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
